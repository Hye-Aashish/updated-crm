<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Away check</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1c1e;
      --muted: #5c6570;
      --line: #d7dce2;
      --panel: #f7f5f1;
      --panel-2: #ffffff;
      --accent: #0b6e4f;
      --warn: #b45309;
      --warn-soft: #fff1e0;
      --shadow: 0 18px 40px rgba(26, 28, 30, 0.16);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: transparent;
      font-family: "DM Sans", "Segoe UI", sans-serif; color: var(--ink); user-select: none;
    }
    .shell { height: 100%; padding: 10px; -webkit-app-region: drag; }
    .card {
      height: 100%;
      display: grid;
      grid-template-columns: 92px 1fr;
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent);
    }
    .rail {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      background: #eef1f4; border-right: 1px solid var(--line); padding: 14px 8px;
    }
    .ring { position: relative; width: 64px; height: 64px; }
    .ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    .ring .track { fill: none; stroke: #d5dbe3; stroke-width: 5; }
    .ring .progress {
      fill: none; stroke: var(--warn); stroke-width: 5; stroke-linecap: round;
      stroke-dasharray: 163.36; stroke-dashoffset: 0; transition: stroke-dashoffset 0.9s linear;
    }
    .ring .seconds {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px; font-weight: 600;
      letter-spacing: -0.03em; color: var(--ink);
    }
    .idle-dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--warn);
      box-shadow: 0 0 0 0 rgba(180, 83, 9, 0.45);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(180, 83, 9, 0.45); }
      70% { box-shadow: 0 0 0 10px rgba(180, 83, 9, 0); }
      100% { box-shadow: 0 0 0 0 rgba(180, 83, 9, 0); }
    }
    .body { display: flex; flex-direction: column; padding: 14px 14px 12px 16px; min-width: 0; }
    .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .brand { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    .badge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--warn); background: var(--warn-soft); border: 1px solid #f3d5a8;
      padding: 3px 7px; border-radius: 999px;
    }
    h1 { font-size: 20px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .copy { font-size: 12.5px; line-height: 1.45; color: var(--muted); max-width: 28ch; }
    .copy strong { color: var(--ink); font-weight: 600; }
    .actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; padding-top: 14px;
      -webkit-app-region: no-drag;
    }
    button {
      height: 36px; border-radius: 3px; border: 1px solid transparent;
      font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.12s ease;
    }
    button:active { transform: translateY(1px); }
    .btn-work { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
    .btn-work:hover { background: #f0f2f5; border-color: #c5ccd5; }
    .btn-break { background: var(--accent); color: #f4fbf7; border-color: #095c42; }
    .btn-break:hover { background: #095c42; }
    .hint {
      margin-top: 8px; font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 10px; color: #8a939e; letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <aside class="rail" aria-hidden="true">
        <div class="ring">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle class="track" cx="32" cy="32" r="26"></circle>
            <circle class="progress" id="progress" cx="32" cy="32" r="26"></circle>
          </svg>
          <div class="seconds" id="timer">30</div>
        </div>
        <div class="idle-dot" title="Status check"></div>
      </aside>
      <section class="body">
        <div class="meta">
          <div class="brand">Nexprism · Workspace</div>
          <div class="badge">Away?</div>
        </div>
        <h1>Taking a short break?</h1>
        <p class="copy">
          Your keyboard has been quiet for a bit. Update your status so your
          team knows you’re <strong>available</strong> or on a break.
        </p>
        <div class="actions">
          <button type="button" class="btn-work" id="btnWork">I’m here</button>
          <button type="button" class="btn-break" id="btnBreak">Start break</button>
        </div>
        <div class="hint" id="hint">Status updates in 30s</div>
      </section>
    </div>
  </div>
  <script>
    const TOTAL = 30;
    const CIRC = 2 * Math.PI * 26;
    let left = TOTAL;
    const timerEl = document.getElementById('timer');
    const hintEl = document.getElementById('hint');
    const progressEl = document.getElementById('progress');
    progressEl.style.strokeDasharray = String(CIRC);
    progressEl.style.strokeDashoffset = '0';

    function paint() {
      timerEl.textContent = String(left);
      hintEl.textContent = left > 0 ? ('Status updates in ' + left + 's') : 'Updating…';
      const done = (TOTAL - left) / TOTAL;
      progressEl.style.strokeDashoffset = String(CIRC * done);
      if (left <= 8) progressEl.style.stroke = '#b45309';
    }
    paint();

    const tick = setInterval(() => {
      left -= 1;
      paint();
      if (left <= 0) {
        clearInterval(tick);
        window.breakPopupAPI?.startBreak();
      }
    }, 1000);

    document.getElementById('btnWork').onclick = () => {
      clearInterval(tick);
      window.breakPopupAPI?.stillWorking();
    };
    document.getElementById('btnBreak').onclick = () => {
      clearInterval(tick);
      window.breakPopupAPI?.startBreak();
    };
  </script>
</body>
</html>
